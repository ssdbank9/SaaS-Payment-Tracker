<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ app_name }}{% endblock %}</title>
<meta name="theme-color" content="#1f6b4e">
<link rel="icon" type="image/svg+xml" href="/assets/mark.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#f3f5f3;--surface:#fff;--surface-2:#eaeeeb;--ink:#161a17;--ink-2:#4a534d;--muted:#76817b;--line:#d8ded9;--line-strong:#b3bcb6;--accent:#1f6b4e;--accent-ink:#175a41;--accent-soft:#dcefe8;--brand:#1f6b4e;--good:#166534;--good-bg:#e1f3e6;--crit:#a12b22;--crit-bg:#fae3df;--focus:#1f6b4e;--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111412;--surface:#191d1a;--surface-2:#212723;--ink:#edf1ee;--ink-2:#b4bdb7;--muted:#838d87;--line:#2b322d;--line-strong:#3e4841;--accent:#3fb391;--accent-ink:#78d4b8;--accent-soft:#1a3a31;--brand:#26805d;--good:#7fd89a;--good-bg:#17311f;--crit:#f0958a;--crit-bg:#3d1f1b;--focus:#3fb391;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111412;--surface:#191d1a;--surface-2:#212723;--ink:#edf1ee;--ink-2:#b4bdb7;--muted:#838d87;--line:#2b322d;--line-strong:#3e4841;--accent:#3fb391;--accent-ink:#78d4b8;--accent-soft:#1a3a31;--brand:#26805d;--good:#7fd89a;--good-bg:#17311f;--crit:#f0958a;--crit-bg:#3d1f1b;--focus:#3fb391;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.brand{display:flex;align-items:center;gap:10px;margin:8px 0 20px;color:var(--ink)}
.brand .mark{width:36px;height:36px;display:block;flex:none}
.brand .mark rect{fill:var(--brand)}
.brand .name{font-weight:600;font-size:18px;letter-spacing:-.01em}
.brand .tag{font-size:13px;color:var(--accent-ink);font-weight:500}
.card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px 20px 20px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
h1{margin:0 0 8px;font-size:22px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
.lead{font-size:17px;line-height:1.55}
.lead b{font-weight:600}
.facts{margin:16px 0 4px;padding:0;list-style:none;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:500}
.facts dd.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.q{margin:18px 0 12px;font-weight:600;font-size:17px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:inherit;font:inherit;font-weight:600;font-size:17px;cursor:pointer;text-decoration:none;padding:10px 14px}
.btn:hover{background:var(--surface-2)}
.btn.yes{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.yes:hover{filter:brightness(1.08)}
.btn.no{color:var(--crit);border-color:var(--crit)}
.btn.sm{min-height:38px;font-size:14px;font-weight:500;padding:6px 12px}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
label.f{display:block;margin-top:14px;font-size:13px;color:var(--ink-2);font-weight:500}
input[type=password],input[type=text],textarea{display:block;width:100%;margin-top:6px;background:var(--surface);color:inherit;border:1px solid var(--line-strong);border-radius:8px;padding:10px 12px;font:inherit;min-height:46px}
textarea{min-height:72px;resize:vertical}
.hint{margin-top:12px;font-size:13px;color:var(--muted)}
.err{margin-top:12px;font-size:14px;color:var(--crit);font-weight:500}
.status{display:flex;gap:12px;align-items:flex-start;border-radius:8px;padding:12px 14px;margin:14px 0 6px;font-size:15px}
.status[data-answer="yes"]{background:var(--good-bg);color:var(--good)}
.status[data-answer="no"]{background:var(--crit-bg);color:var(--crit)}
.status .when{display:block;font-size:12px;opacity:.85;font-family:var(--mono)}
.foot{margin-top:18px;font-size:12px;color:var(--muted);text-align:center;max-width:440px}
</style>
{% block head %}{% endblock %}
</head>
<body>
{# v24: the Wasooli mark (a W whose last stroke is a check); a custom app name shows its first letter on the same tile #}
<div class="brand" aria-label="{{ app_name }}"><svg class="mark" viewBox="0 0 64 64" width="36" height="36" aria-hidden="true" focusable="false"><rect width="64" height="64" rx="14"/>{% if app_name == 'Wasooli' %}<path d="M11.5 22 L20 44 L28.5 27 L37 44 L52.5 16" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>{% else %}<text x="32" y="32" dy="0.36em" text-anchor="middle" font-family="IBM Plex Sans,system-ui,sans-serif" font-weight="600" font-size="37" fill="#fff">{{ app_name[:1]|upper }}</text>{% endif %}</svg><span><span class="name">{{ app_name }}</span> <span class="tag">{{ tagline }}</span></span></div>
{% block body %}{% endblock %}
</body>
</html>
